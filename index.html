<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת אילנות יוחסין</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🌳 ניהול אילנות יוחסין (ללא הגבלה)</h1>
    <div class="box">
        <h2>1. בחירה או יצירת אילן חדש</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="treeSelect" style="flex: 1; font-weight: bold;">
                <option value="">-- בחרי אילן קיים --</option>
            </select>
            <button id="btnDeleteTree" type="button" style="background: #dc2626; display: none;">🗑️ מחק אילן</button>
        </div>
        <hr>
        <div class="grid">
            <input type="email" id="userEmail" placeholder="האימייל שלך">
            <input type="text" id="treeTitle" placeholder="שם האילן החדש">
        </div>
        <button id="btnCreateTree" type="button">+ צור אילן חדש</button>
    </div>

    <div id="workspace" style="display:none;">
        <div class="grid">
            <div class="box" id="personFormBox">
                <h2 id="formTitle">2. הוספת אדם לאילן</h2>
                <input type="text" id="firstName" placeholder="שם פרטי *" style="width:92%"><br>
                <input type="text" id="lastName" placeholder="שם משפחה" style="width:92%"><br>
                <input type="text" id="maidenName" placeholder="שם משפחה לפני נישואין (אופציונלי)" style="width:92%"><br>
                <select id="gender" style="width:96%">
                    <option value="male">זכר</option>
                    <option value="female">נקבה</option>
                    <option value="unknown">לא ידוע</option>
                </select><br>
                <input type="text" id="occupation" placeholder="עיסוק עיקרי" style="width:92%"><br>
                <input type="text" id="birthApprox" placeholder="שנת/תאריך לידה" style="width:92%"><br>
                <input type="text" id="birthPlace" placeholder="מקום לידה" style="width:92%"><br>
                <label class="checkbox-row">
                    <input type="checkbox" id="isDeceased">
                    <span>נפטר/ה (ז״ל) - מסגרת שחורה עבה</span>
                </label>
                <div id="deathFieldContainer" style="display:none;">
                    <input type="text" id="deathApprox" placeholder="שנת/תאריך פטירה" style="width:92%"><br>
                </div>
                <input type="url" id="link1" placeholder="קישור 1 (ויקיפדיה / יזכור)" style="width:92%"><br>
                <input type="url" id="link2" placeholder="קישור 2 נוסף" style="width:92%"><br>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button id="btnAddPerson" type="button">+ הוסף אדם לאילן</button>
                    <button id="btnCancelEdit" type="button" style="background: #64748b; display: none;">ביטול עריכה</button>
                </div>
            </div>

            <div class="box">
                <h2>3. הגדרת קשר הורה - ילד</h2>
                <label>בחרי הורה:</label><br>
                <select id="parentSelect" style="width:96%"></select><br><br>
                <label>בחרי ילד/ה:</label><br>
                <select id="childSelect" style="width:96%"></select><br><br>
                <button id="btnAddRel" type="button">🔗 חבר הורה וילד</button>
            </div>
        </div>

        <div class="box">
            <h2>🖼️ תרשים אילן היוחסין</h2>
            <div class="tree-canvas"><div id="treeDiagram" class="tree"></div></div>
        </div>
    </div>
</div>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
